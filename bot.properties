# Reread every cycle while the bot runs: save this file and changes apply within seconds.
# Exchange URL and login are not in this file: they come from .env (see .env.example).


# true = log the orders it would send, without sending them
dry_run=false
# true = cancel all orders and stop trading (the kill switch)
paused=false

requests_per_second=1.0
cycle_ms=500

# Danish time. WIND_RANGE measures max - min wind from open to close.
session_open=16:00
session_close=17:45

products=1_WIND,2_CO2,3_FLOW,4_ETF,5_WIND_RANGE
# comma-separated products to stop trading, e.g. disabled=5_WIND_RANGE
disabled=

# our own limit per product (the exchange's is 100)
max_position=40
# per-product override (FLOW trends with hourly schedules)
max_position.3_FLOW=5
max_position.1_WIND=40
max_position.2_CO2=40
max_position.4_ETF=40
max_position.5_WIND_RANGE=100
quote_size=3
take_size=15

# typical 15-minute move per product, from the rules sheet
typical_move.1_WIND=14
typical_move.2_CO2=24
typical_move.3_FLOW=31
typical_move.4_ETF=41
typical_move.5_WIND_RANGE=5.7

# Edges, in units of the settlement uncertainty (which shrinks towards the close).
quote_k=0.10
take_k=0.05

# fair = model_weight * our model + (1 - model_weight) * market mid
model_weight=1.0
# at the position limit, quotes lean this many half-spreads towards getting flat
skew_k=2

# ETF arbitrage: trade when ETF and the sum of its parts differ by at least this much
arb_min_edge=8
arb_size=2

# Optional predicted settlement values, blended in with this weight (0 = ignore)
forecast_weight=0
#forecast.1_WIND=
#forecast.2_CO2=
#forecast.3_FLOW=
forecast.5_WIND_RANGE=150

# keep a resting quote unless its target moved at least this many ticks (saves requests)
reprice_ticks=8

# after a new item on /api/news: cancel all quotes and wait this long
news_pause_seconds=20

# add this share of the last 5 minutes move to the current value (trend following)
momentum_k=0
